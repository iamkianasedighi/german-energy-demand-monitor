[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "german-energy-demand-monitor"
version = "0.3.2"
description = "German electricity demand and day-ahead price monitoring"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3", "numpy>=1.26,<3", "requests>=2.31,<3",
    "scipy>=1.12,<2", "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
